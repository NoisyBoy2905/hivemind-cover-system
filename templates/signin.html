{% extends "base.html" %}
{% block content %}
<div class="signin">
    <h2>Sign In</h2>
    <p>Welcome back to HiveMind Ed</p>
    {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" autocomplete="username" value="{{ username }}" required {% if not username %}autofocus{% endif %}>
        <label for="password">Password:</label>
        <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" id="toggle-password" aria-label="Show Password"><h3>👁</h3></button>
        </div>
        <button type="submit">Sign In</button>
    </form>
    <script src="{{ url_for('static', filename='JS/signin.js') }}"></script>
</div>
{% endblock %}
