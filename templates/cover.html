{% extends "base.html" %}
{% block content %}
<div class="cover-form">
    <h2>Request Cover</h2>
    <p>Fill in the lesson you need covered and the work for the class.</p>
    {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label for="class_name">Class:</label>
        <input type="text" id="class_name" name="class_name" value="{{ form.get('class_name', '') }}" required>
        <label for="room">Room:</label>
        <input type="text" id="room" name="room" value="{{ form.get('room', '') }}" required>
        <label for="subject">Subject:</label>
        <select id="subject" name="subject" required>
            <option value="">Select a subject</option>
            {% for subject in subjects %}
                <option value="{{ subject }}" {% if form.get('subject') == subject %}selected{% endif %}>{{ subject }}</option>
            {% endfor %}
        </select>
        <label for="lesson_date">Date:</label>
        <input type="date" id="lesson_date" name="lesson_date" min="{{ today }}" value="{{ form.get('lesson_date', today) }}" required>
        <label for="period">Period:</label>
        <select id="period" name="period" required>
            <option value="">Select a period</option>
            {% for number, times in periods.items() %}
                <option value="{{ number }}" {% if form.get('period') == number|string %}selected{% endif %}>P{{ number }} ({{ times[0] }} – {{ times[1] }})</option>
            {% endfor %}
        </select>
        <label for="set_work">Set work:</label>
        <textarea id="set_work" name="set_work" rows="4" required>{{ form.get('set_work', '') }}</textarea>
        <label for="resources">Resources (optional):</label>
        <input type="text" id="resources" name="resources" value="{{ form.get('resources', '') }}">
        <button type="submit">Request Cover</button>
    </form>
</div>
{% endblock %}
